name: Trusted Publish

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]

permissions:
  id-token: write   # required to request a GitHub Actions OIDC token
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      CHANNEL_SERVER: https://conda.matt-kramer.com
      CHANNEL: mattkram/trusted-publishing-test
      PACKAGE_NAME: test-trusted-publishing
      VERSION: "0.1.${{ github.run_number }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Build a minimal .conda package from scratch ──────────────────────
      # A .conda file is a ZIP of two zstd-compressed tarballs:
      #   pkg-<name>-<ver>-<build>.tar.zst   — (empty payload)
      #   info-<name>-<ver>-<build>.tar.zst  — info/index.json, info/paths.json, info/about.json
      - name: Build .conda package
        run: |
          set -euo pipefail
          pip install zstandard --quiet

          BUILD_STEM="${PACKAGE_NAME}-${VERSION}-0"
          WORK=$(mktemp -d)

          # --- info files ---
          mkdir -p "${WORK}/info_root/info"

          cat > "${WORK}/info_root/info/index.json" <<EOF
          {
            "name": "${PACKAGE_NAME}",
            "version": "${VERSION}",
            "build": "0",
            "build_number": 0,
            "subdir": "noarch",
            "depends": [],
            "noarch": "generic"
          }
          EOF

          cat > "${WORK}/info_root/info/paths.json" <<'EOF'
          {"paths_version": 1, "paths": []}
          EOF

          cat > "${WORK}/info_root/info/about.json" <<EOF
          {
            "summary": "Minimal test package for trusted publishing CI",
            "home": "https://github.com/${{ github.repository }}"
          }
          EOF

          # Build the .conda zip via Python
          python3 - "${WORK}" "${BUILD_STEM}" <<'PYEOF'
          import sys, tarfile, zipfile, zstandard

          work, build_stem = sys.argv[1], sys.argv[2]

          cctx = zstandard.ZstdCompressor(level=3)

          # info tarball
          info_tar = f"{work}/info-{build_stem}.tar"
          with tarfile.open(info_tar, "w") as t:
              t.add(f"{work}/info_root/info", arcname="info")
          with open(info_tar, "rb") as src, open(f"{work}/info-{build_stem}.tar.zst", "wb") as dst:
              cctx.copy_stream(src, dst)

          # pkg tarball (empty payload)
          pkg_tar = f"{work}/pkg-{build_stem}.tar"
          with tarfile.open(pkg_tar, "w"):
              pass
          with open(pkg_tar, "rb") as src, open(f"{work}/pkg-{build_stem}.tar.zst", "wb") as dst:
              cctx.copy_stream(src, dst)

          # assemble .conda zip (written to CWD)
          conda_path = f"{build_stem}.conda"
          with zipfile.ZipFile(conda_path, "w", compression=zipfile.ZIP_STORED) as zf:
              zf.write(f"{work}/pkg-{build_stem}.tar.zst",  f"pkg-{build_stem}.tar.zst")
              zf.write(f"{work}/info-{build_stem}.tar.zst", f"info-{build_stem}.tar.zst")
          print(f"Built: {conda_path}")
          PYEOF

      # ── Exchange OIDC token for a scoped upload token ─────────────────────
      - name: Get OIDC token and exchange for upload token
        id: get_token
        run: |
          set -euo pipefail

          # Request the OIDC JWT from GitHub's token endpoint.
          # audience must match the value the Worker checks: conda-wit
          OIDC_TOKEN=$(curl -sSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=conda-wit" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")

          # Exchange OIDC token for a scoped upload token; print body on error
          RESPONSE=$(curl -sSL -w "\n%{http_code}" -X POST "${CHANNEL_SERVER}/upload/exchange-oidc" \
            -H "Content-Type: application/json" \
            -d "{\"oidc_token\": \"${OIDC_TOKEN}\", \"channel\": \"${CHANNEL}\"}")

          HTTP_CODE=$(echo "${RESPONSE}" | tail -1)
          BODY=$(echo "${RESPONSE}" | head -n -1)

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "exchange-oidc failed (HTTP ${HTTP_CODE}): ${BODY}"
            exit 1
          fi

          UPLOAD_TOKEN=$(echo "${BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_token'])")

          # Mask the token so it never appears in logs
          echo "::add-mask::${UPLOAD_TOKEN}"
          echo "upload_token=${UPLOAD_TOKEN}" >> "${GITHUB_OUTPUT}"

      # ── Upload the package ────────────────────────────────────────────────
      - name: Upload package
        run: |
          set -euo pipefail

          FILENAME="${PACKAGE_NAME}-${VERSION}-0.conda"
          UPLOAD_TOKEN="${{ steps.get_token.outputs.upload_token }}"

          echo "Uploading ${FILENAME} to channel ${CHANNEL} ..."

          # Step 1: get presigned PUT URL
          INIT_RESP=$(curl -sSL -w "\n%{http_code}" -X POST "${CHANNEL_SERVER}/upload/init" \
            -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"channel\": \"${CHANNEL}\", \"filename\": \"${FILENAME}\"}")
          INIT_CODE=$(echo "${INIT_RESP}" | tail -1)
          INIT_BODY=$(echo "${INIT_RESP}" | head -n -1)
          if [ "${INIT_CODE}" != "200" ]; then
            echo "upload/init failed (HTTP ${INIT_CODE}): ${INIT_BODY}"; exit 1
          fi

          UPLOAD_URL=$(echo "${INIT_BODY}" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'])")

          # Step 2: PUT the package directly to R2
          curl -fsSL -X PUT "${UPLOAD_URL}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${FILENAME}"

          # Step 3: notify the Worker the upload is complete
          COMPLETE_RESP=$(curl -sSL -w "\n%{http_code}" -X POST "${CHANNEL_SERVER}/upload/complete" \
            -H "Authorization: Bearer ${UPLOAD_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"channel\": \"${CHANNEL}\", \"filename\": \"${FILENAME}\"}")
          COMPLETE_CODE=$(echo "${COMPLETE_RESP}" | tail -1)
          COMPLETE_BODY=$(echo "${COMPLETE_RESP}" | head -n -1)
          if [ "${COMPLETE_CODE}" != "202" ]; then
            echo "upload/complete failed (HTTP ${COMPLETE_CODE}): ${COMPLETE_BODY}"; exit 1
          fi

          echo "Upload complete. Indexing is async — check ${CHANNEL_SERVER}/channels/${CHANNEL} in ~10s."
