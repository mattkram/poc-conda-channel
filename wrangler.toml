name = "conda-channel-server"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Static assets served directly from public/ — no Worker code involved.
# Covers /logo.png, /favicon.ico, etc.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

[observability]
enabled = true

[[r2_buckets]]
binding = "CHANNEL_BUCKET"
bucket_name = "conda-channel"

[vars]
R2_BUCKET_NAME = "conda-channel"
SUPERADMIN_LOGIN = "mattkram"

# Secrets: GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, UPLOAD_TOKEN_SECRET,
#          R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID,
#          INTERNAL_SECRET  (shared secret for container→worker /internal/upsert-package calls)

[durable_objects]
bindings = [
  { name = "INDEXER",      class_name = "IndexerContainer" },
  { name = "QUEUE",        class_name = "ChannelQueue" },
  { name = "INGESTOR",     class_name = "PackageIngestor" },
  { name = "MERGER",       class_name = "SubdirIndexMerger" },
  { name = "INGEST_QUEUE", class_name = "ChannelIngestQueue" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IndexerContainer"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChannelQueue"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["PackageIngestor", "SubdirIndexMerger"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["ChannelIngestQueue"]

[[d1_databases]]
binding = "DB"
database_name = "conda-channel-meta"
database_id = "405fca88-996a-4931-abd7-cbbc07d538c8"

[[containers]]
class_name = "IndexerContainer"
image = "./container/Dockerfile"
max_instances = 10      # pool of 10 workers shared across all channels
instance_type = "basic" # one file download + metadata extraction per request
